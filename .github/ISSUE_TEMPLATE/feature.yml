name: Feature request
description: Propose an API, profile, or corpus improvement.
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe the subprocess boundary that cannot be expressed today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed contract
      description: Explain source provenance, platform/runtime scope, and compatibility impact.
    validations:
      required: true
